<h2>Produtos</h2>

<p *ngIf="erro" style="color: red">{{ erro }}</p>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <label>
    Código
    <input type="number" formControlName="codigo" />
  </label>

  <label>
    Descrição
    <input type="text" formControlName="descricao" />
  </label>

  <label>
    Valor
    <input type="number" step="0.01" formControlName="valorProduto" />
  </label>

  <label>
    Saldo (quantidade em estoque)
    <input type="number" formControlName="quantidadeEstoque" />
  </label>

  <button type="submit" [disabled]="salvando">
    {{ salvando ? 'Salvando...' : 'Cadastrar produto' }}
  </button>
</form>

<hr />

<p *ngIf="carregando">Carregando produtos...</p>

<table *ngIf="!carregando">
  <thead>
    <tr>
      <th>ID</th>
      <th>Código</th>
      <th>Descrição</th>
      <th>Valor</th>
      <th>Saldo</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let produto of produtos">
      <td>{{ produto.idProduto }}</td>
      <td>{{ produto.codigo }}</td>
      <td>{{ produto.descricao }}</td>
      <td>{{ produto.valorProduto }}</td>
      <td>{{ produto.quantidadeEstoque }}</td>
    </tr>
    <tr *ngIf="produtos.length === 0">
      <td colspan="5">Nenhum produto cadastrado.</td>
    </tr>
  </tbody>
</table>
